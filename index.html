<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#f6f0e6">
  <title>Vasito — Aprende a doblar un vaso de papel</title>
  <style>
    :root {
      --fondo: #f6f0e6;
      --papel-mamey: #e8734a;
      --papel-mamey-oscuro: #c85a35;
      --papel-blanco: #ffffff;
      --tinta: #1d2e24;
      --suave: #536458;
      --verde: #336948;
      --verde-hover: #265237;
      --rojo-doblez: #d9383a;
      --borde: #e4dacb;
      --tarjeta: #ffffff;
      --sombra: 0 14px 36px rgba(45, 35, 25, 0.08);
      --radio: 20px;
      --font-size-base: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: var(--font-size-base);
      scroll-behavior: smooth;
    }
    body {
      background: var(--fondo);
      color: var(--tinta);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px 12px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: min(620px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Cabecera */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px 18px;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--tinta);
      letter-spacing: -0.02em;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--papel-mamey);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(232, 115, 74, 0.25);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-font {
      background: #fdfaf5;
      border: 1px solid var(--borde);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--suave);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-font:hover {
      background: #eee4d7;
      color: var(--tinta);
    }
    .pill-offline {
      background: #e6f3eb;
      color: var(--verde);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(51, 105, 72, 0.2);
    }

    /* Introducción */
    .intro {
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .intro h1 {
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      line-height: 1.2;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .intro p {
      color: var(--suave);
      font-size: 1.05rem;
    }

    /* Tarjeta Principal */
    .card {
      background: var(--tarjeta);
      border-radius: var(--radio);
      border: 1px solid var(--borde);
      box-shadow: var(--sombra);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    /* Progreso */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .step-chip {
      background: rgba(232, 115, 74, 0.12);
      color: var(--papel-mamey-oscuro);
      font-size: 0.9rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .progress-bar {
      height: 8px;
      background: #ede5da;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      width: 16.666%;
      background: linear-gradient(90deg, var(--papel-mamey), #f4a261);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Barra de Ángulos 3D */
    .angle-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .angle-btn {
      flex: 1;
      min-width: 65px;
      background: #f7efe4;
      border: 1px solid #e2d4c3;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--suave);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .angle-btn:hover {
      background: #ede1d2;
      color: var(--tinta);
    }
    .angle-btn.active {
      background: var(--tinta);
      color: #ffffff;
      border-color: var(--tinta);
    }

    /* Escenario Interactivo 3D */
    .stage-wrapper {
      background: #faf6ef;
      border: 1px solid #ebd9c5;
      border-radius: 16px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
    }
    .stage-wrapper:active {
      cursor: grabbing;
    }
    .viewport-3d {
      perspective: 1100px;
      width: 100%;
      height: 250px;
      display: grid;
      place-items: center;
    }
    .scene-3d {
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      width: 100%;
      max-width: 380px;
      height: 250px;
      display: grid;
      place-items: center;
    }
    .scene-3d.smooth-preset {
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #paperSvg {
      width: 100%;
      max-width: 380px;
      height: 250px;
      display: block;
      overflow: visible;
    }

    /* Barra inferior del escenario: Botón de Animación y Centrar */
    .stage-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 8px 12px;
      background: rgba(247, 239, 228, 0.7);
      border-top: 1px solid #ebd9c5;
      z-index: 2;
    }
    .btn-anim {
      background: var(--verde);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(51, 105, 72, 0.2);
      transition: background-color 0.15s;
    }
    .btn-anim:hover {
      background: var(--verde-hover);
    }
    .btn-anim:active {
      transform: scale(0.96);
    }
    .btn-center {
      background: transparent;
      border: 1px solid #d8c7b4;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--suave);
      cursor: pointer;
    }
    .btn-center:hover {
      background: #eee3d5;
      color: var(--tinta);
    }

    /* Estilos SVG */
    .fold-line {
      stroke: var(--rojo-doblez);
      stroke-width: 2.5;
      stroke-dasharray: 6 5;
      stroke-linecap: round;
    }
    .fold-line-glow {
      stroke: rgba(217, 56, 58, 0.3);
      stroke-width: 6;
      stroke-linecap: round;
    }
    .ghost-line {
      stroke: #a08c79;
      stroke-width: 1.8;
      stroke-dasharray: 4 4;
    }

    /* Textos del Paso */
    .step-content {
      margin: 18px 0 24px;
    }
    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      color: var(--tinta);
    }
    .step-instruction {
      font-size: 1.1rem;
      line-height: 1.55;
      color: #2a3d32;
      margin-bottom: 14px;
    }
    .tip-card {
      background: #fbf5ed;
      border-left: 4px solid var(--papel-mamey);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: #5a4b3d;
      line-height: 1.45;
    }
    .tip-card strong {
      color: var(--papel-mamey-oscuro);
    }

    /* Botones de Navegación */
    .nav-buttons {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      min-height: 54px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, background-color 0.15s, box-shadow 0.15s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-prev {
      background: #f0e7db;
      color: var(--tinta);
      border: 1px solid var(--borde);
    }
    .btn-prev:hover:not(:disabled) {
      background: #e6dcce;
    }
    .btn-next {
      background: var(--verde);
      color: white;
      box-shadow: 0 4px 12px rgba(51, 105, 72, 0.25);
    }
    .btn-next:hover:not(:disabled) {
      background: var(--verde-hover);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Modal / Banner de Felicitación Final */
    .celebration-banner {
      display: none;
      background: #e6f3eb;
      border: 2px solid var(--verde);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin-bottom: 18px;
      animation: popIn 0.35s ease;
    }
    .celebration-banner.show {
      display: block;
    }
    .celebration-banner h3 {
      font-size: 1.25rem;
      color: var(--verde-hover);
      margin-bottom: 4px;
    }
    .celebration-banner p {
      font-size: 0.95rem;
      color: #294734;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-icon">🥤</div>
        Vasito
      </div>
      <div class="header-actions">
        <button class="btn-font" id="fontToggleBtn" title="Cambiar tamaño de letra">
          <span>🔤</span> <span id="fontBtnText">Letra grande</span>
        </button>
        <span class="pill-offline">● Sin internet</span>
      </div>
    </header>

    <section class="intro">
      <h1>Una hoja, un vaso.<br>¡Tú puedes!</h1>
      <p>Sigue cada doblez paso a paso. Gira el papel en 3D para entenderlo con claridad.</p>
    </section>

    <main class="card" aria-label="Instrucciones paso a paso">
      <div class="progress-header">
        <span class="step-chip" id="stepChip">Paso 1 de 6</span>
      </div>

      <div class="progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <!-- Barra de Botones de Ángulo 3D -->
      <div class="angle-bar" role="group" aria-label="Ángulos de vista 3D">
        <button class="angle-btn active" data-angle="frente">👁️ Frente</button>
        <button class="angle-btn" data-angle="perspectiva">🧊 3D</button>
        <button class="angle-btn" data-angle="arriba">🔍 Arriba</button>
        <button class="angle-btn" data-angle="atras">🔄 Atrás</button>
      </div>

      <!-- Escenario Interactivo con Giro 3D Libre y Animación -->
      <div class="stage-wrapper" id="stageWrapper" title="Arrastra con el dedo o ratón para girar libremente en 3D">
        <div class="viewport-3d">
          <div class="scene-3d" id="paperScene">
            <svg id="paperSvg" viewBox="0 0 380 320" role="img" aria-label="Ilustración 3D del paso">
              <defs>
                <marker id="foldArrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill="#336948"/>
                </marker>
              </defs>
              <g id="drawingGroup"></g>
            </svg>
          </div>
        </div>

        <div class="stage-footer">
          <button class="btn-anim" id="animateFoldBtn">
            <span>▶</span> Ver cómo se dobla
          </button>
          <button class="btn-center" id="resetAngleBtn" title="Restablecer posición de frente">
            ↺ Centrar vista
          </button>
        </div>
      </div>

      <div class="step-content">
        <div class="celebration-banner" id="celebrationBanner">
          <h3>🎉 ¡Felicidades! Lograste tu vasito de papel</h3>
          <p>Pruébalo con agua o úsalo para guardar pequeños objetos. ¡Gran trabajo!</p>
        </div>

        <h2 class="step-title" id="stepTitle"></h2>
        <p class="step-instruction" id="stepInstruction"></p>
        <div class="tip-card" id="stepTip"></div>
      </div>

      <div class="nav-buttons">
        <button class="btn btn-prev" id="btnPrev" disabled>← Anterior</button>
        <button class="btn btn-next" id="btnNext">Siguiente paso →</button>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const pasos = [
      {
        titulo: "Paso 1: Dobla la hoja por la mitad",
        instruccion: "Pon la hoja como un diamante (una punta arriba y otra abajo). Lleva la punta de abajo hasta la punta de arriba para formar un triángulo.",
        consejo: "Alinea bien las puntas antes de aplastar el pliegue con los dedos."
      },
      {
        titulo: "Paso 2: Dobla la punta derecha hacia la izquierda",
        instruccion: "Toma la punta de la derecha y llévala hacia el borde izquierdo. El borde superior de lo que doblaste debe quedar completamente recto y horizontal.",
        consejo: "El borde de arriba debe verse horizontal, como una mesa recta."
      },
      {
        titulo: "Paso 3: Dobla la punta izquierda hacia la derecha",
        instruccion: "Ahora toma la punta de la izquierda y crúzala hacia la derecha por encima de la anterior, llevándola hasta la esquina contraria.",
        consejo: "Las dos solapas quedan cruzadas en el frente, una sobre la otra."
      },
      {
        titulo: "Paso 4: Guarda la punta delantera en el bolsillo",
        instruccion: "Arriba te quedan dos puntas sueltas. Toma solo la de adelante, bájala hacia ti y métela dentro del bolsillo frontal. Deja la otra punta arriba.",
        consejo: "¡Ojo! Son dos puntas: dobla únicamente la de adelante, la otra se queda arriba."
      },
      {
        titulo: "Paso 5: Voltea el vaso y dobla la otra punta",
        instruccion: "Dale la vuelta a todo el papel. Ahora toma la otra punta (la que dejamos arriba) y dóblala hacia abajo por detrás, pegada al vaso.",
        consejo: "Pasa los dedos firmemente sobre el borde superior para asegurar la forma."
      },
      {
        titulo: "Paso 6: Abre tu vasito",
        instruccion: "Presiona suavemente los lados con los dedos para abrir la boca del vaso y separar las paredes interiores.",
        consejo: "¡Listo! Ya tienes tu vaso de papel terminado y listo para usar."
      }
    ];

    let actual = 0;
    let rotX = 0;
    let rotY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let animTimer = null;
    let largeFont = false;

    const stepChip = document.getElementById("stepChip");
    const progressFill = document.getElementById("progressFill");
    const stepTitle = document.getElementById("stepTitle");
    const stepInstruction = document.getElementById("stepInstruction");
    const stepTip = document.getElementById("stepTip");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const drawingGroup = document.getElementById("drawingGroup");
    const paperScene = document.getElementById("paperScene");
    const stageWrapper = document.getElementById("stageWrapper");
    const angleButtons = document.querySelectorAll(".angle-btn");
    const resetAngleBtn = document.getElementById("resetAngleBtn");
    const animateFoldBtn = document.getElementById("animateFoldBtn");
    const fontToggleBtn = document.getElementById("fontToggleBtn");
    const fontBtnText = document.getElementById("fontBtnText");
    const celebrationBanner = document.getElementById("celebrationBanner");
    const confettiCanvas = document.getElementById("confettiCanvas");

    const ns = "http://www.w3.org/2000/svg";

    function el(tag, attrs = {}, text = "") {
      const node = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      if (text) node.textContent = text;
      return node;
    }

    function clearDrawing() {
      while (drawingGroup.firstChild) drawingGroup.removeChild(drawingGroup.firstChild);
    }

    function drawFoldLine(x1, y1, x2, y2, label = "", labelYOffset = -14) {
      drawingGroup.appendChild(el("line", { x1, y1, x2, y2, class: "fold-line-glow" }));
      drawingGroup.appendChild(el("line", { x1, y1, x2, y2, class: "fold-line" }));

      if (label) {
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2 + labelYOffset;
        const width = label.length * 6.5 + 16;
        drawingGroup.appendChild(el("rect", {
          x: mx - width / 2, y: my - 10, width, height: 18, rx: 9, fill: "#d9383a"
        }));
        drawingGroup.appendChild(el("text", {
          x: mx, y: my + 3, "text-anchor": "middle", fill: "#ffffff",
          "font-size": "10.5", "font-weight": "800", "font-family": "system-ui"
        }, label));
      }
    }

    function drawArrow(x1, y1, x2, y2, qx, qy, label = "") {
      const midX = qx !== undefined ? qx : (x1 + x2) / 2;
      const midY = qy !== undefined ? qy : (y1 + y2) / 2 - 18;

      drawingGroup.appendChild(el("path", {
        d: `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`,
        fill: "none", stroke: "#336948", "stroke-width": "3.5",
        "stroke-linecap": "round", "marker-end": "url(#foldArrow)"
      }));

      if (label) {
        drawingGroup.appendChild(el("text", {
          x: midX, y: midY - 8, "text-anchor": "middle",
          fill: "#224731", "font-size": "10.5", "font-weight": "800"
        }, label));
      }
    }

    /* ── Renderizado SVG con Corrección de Separación y Geometría ── */
    function drawPaperModel(stepIndex, t = 0) {
      clearDrawing();

      const mamey = "#e8734a";
      const mameyOscuro = "#c85a35";
      const blanco = "#ffffff";
      const borde = "#382315";
      const verde = "#336948";

      // Sombra en la mesa
      drawingGroup.appendChild(el("ellipse", {
        cx: 190, cy: 290, rx: 110, ry: 14, fill: "#543d2c", opacity: "0.1"
      }));

      if (stepIndex === 0) {
        // PASO 1
        drawingGroup.appendChild(el("polygon", {
          points: "190,40 310,160 70,160",
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        if (t > 0) {
          drawingGroup.appendChild(el("polygon", {
            points: "70,160 310,160 190,280",
            fill: "rgba(255,255,255,0.7)", class: "ghost-line"
          }));
          const curY = 280 - (280 - 40) * t;
          drawingGroup.appendChild(el("polygon", {
            points: `70,160 310,160 190,${curY}`,
            fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
          }));
        } else {
          drawingGroup.appendChild(el("polygon", {
            points: "70,160 310,160 190,280",
            fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
          }));
          drawFoldLine(70, 160, 310, 160, "Línea de pliegue");
          drawArrow(190, 260, 190, 80, 165, 170, "Lleva la punta arriba");
        }

      } else if (stepIndex === 1) {
        // PASO 2
        drawingGroup.appendChild(el("polygon", {
          points: "190,40 70,160 310,160",
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        drawingGroup.appendChild(el("line", {
          x1: 115, y1: 115, x2: 265, y2: 115,
          stroke: verde, "stroke-width": "2", "stroke-dasharray": "4 4", opacity: "0.8"
        }));
        drawingGroup.appendChild(el("text", {
          x: 190, y: 108, "text-anchor": "middle",
          fill: verde, "font-size": "9.5", "font-weight": "800"
        }, "— El borde de arriba queda completamente recto —"));

        drawingGroup.appendChild(el("polygon", {
          points: "160,160 265,115 310,160",
          fill: "rgba(255,255,255,0.75)", class: "ghost-line"
        }));

        const targetX = 310 - (310 - 115) * t;
        const targetY = 160 - (160 - 115) * t;
        drawingGroup.appendChild(el("polygon", {
          points: `160,160 265,115 ${targetX},${targetY}`,
          fill: mameyOscuro, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        if (t === 0) {
          drawFoldLine(160, 160, 265, 115);
          drawArrow(290, 150, 125, 120, 210, 85, "Hacia el borde izquierdo");
        }

      } else if (stepIndex === 2) {
        // PASO 3
        drawingGroup.appendChild(el("polygon", {
          points: "190,40 70,160 310,160",
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        drawingGroup.appendChild(el("polygon", {
          points: "160,160 265,115 310,160",
          fill: "rgba(255,255,255,0.75)", class: "ghost-line"
        }));
        drawingGroup.appendChild(el("polygon", {
          points: "70,160 115,115 220,160",
          fill: "rgba(255,255,255,0.75)", class: "ghost-line"
        }));

        drawingGroup.appendChild(el("polygon", {
          points: "160,160 265,115 115,115",
          fill: mameyOscuro, stroke: borde, "stroke-width": "2", "stroke-linejoin": "round"
        }));

        const targetX = 70 + (265 - 70) * t;
        const targetY = 160 - (160 - 115) * t;
        drawingGroup.appendChild(el("polygon", {
          points: `220,160 115,115 ${targetX},${targetY}`,
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        if (t === 0) {
          drawFoldLine(220, 160, 115, 115);
          drawArrow(85, 150, 255, 120, 170, 85, "Cruza hacia la derecha");
        }

      } else if (stepIndex === 3) {
        // PASO 4: Sin choque de texto
        drawingGroup.appendChild(el("polygon", {
          points: "115,115 265,115 220,160 160,160",
          fill: mameyOscuro, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        // Punta trasera (blanca erguida)
        drawingGroup.appendChild(el("polygon", {
          points: "115,115 190,40 265,115",
          fill: blanco, stroke: borde, "stroke-width": "2.2", "stroke-linejoin": "round"
        }));

        // Texto ubicado en zona despejada arriba
        drawingGroup.appendChild(el("text", {
          x: 190, y: 20, "text-anchor": "middle",
          fill: "#5a4b3d", "font-size": "10.5", "font-weight": "800"
        }, "Arriba hay 2 puntas: toma solo la del frente"));

        const curY = 40 + (165 - 40) * t;
        drawingGroup.appendChild(el("polygon", {
          points: `115,115 265,115 190,${curY}`,
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        if (t === 0) {
          drawFoldLine(115, 115, 265, 115, "Doblar hacia ti");
          drawArrow(190, 50, 190, 145, 215, 95, "Al bolsillo");
        }

      } else if (stepIndex === 4) {
        // PASO 5
        drawingGroup.appendChild(el("text", {
          x: 190, y: 22, "text-anchor": "middle",
          fill: verde, "font-size": "11.5", "font-weight": "800"
        }, "🔄 Voltea el vaso hacia la espalda"));

        drawingGroup.appendChild(el("polygon", {
          points: "115,115 265,115 220,160 160,160",
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        const curY = 40 + (165 - 40) * t;
        drawingGroup.appendChild(el("polygon", {
          points: `115,115 265,115 190,${curY}`,
          fill: mameyOscuro, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        if (t === 0) {
          drawFoldLine(115, 115, 265, 115);
          drawArrow(190, 50, 190, 145, 165, 95, "Dobla hacia abajo pegada al vaso");
        }

      } else if (stepIndex === 5) {
        // PASO 6
        drawingGroup.appendChild(el("polygon", {
          points: "115,115 265,115 220,180 160,180",
          fill: mamey, stroke: borde, "stroke-width": "2.5", "stroke-linejoin": "round"
        }));

        const rx = 10 + (75 - 10) * t;
        const ry = 4 + (20 - 4) * t;

        drawingGroup.appendChild(el("ellipse", {
          cx: 190, cy: 115, rx, ry,
          fill: "#5a2d18", stroke: borde, "stroke-width": "2.5"
        }));

        if (t === 0) {
          drawArrow(90, 145, 125, 145, 107, 135, "Aprieta");
          drawArrow(290, 145, 255, 145, 273, 135, "Aprieta");
        }

        drawingGroup.appendChild(el("text", {
          x: 190, y: 220, "text-anchor": "middle",
          fill: verde, "font-size": "13", "font-weight": "800"
        }, "🎉 ¡El vaso está abierto y listo!"));
      }
    }

    /* ── Controles 3D y Giro Libre Suave ── */
    function updateTransform(smooth = false) {
      if (smooth) paperScene.classList.add("smooth-preset");
      else paperScene.classList.remove("smooth-preset");
      paperScene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    function resetToFront() {
      angleButtons.forEach(b => b.classList.remove("active"));
      document.querySelector('[data-angle="frente"]').classList.add("active");
      rotX = 0;
      rotY = 0;
      updateTransform(true);
    }

    const anglePresets = {
      frente: { x: 0, y: 0 },
      perspectiva: { x: 22, y: -26 },
      arriba: { x: 62, y: 0 },
      atras: { x: 0, y: 180 }
    };

    angleButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        angleButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const angle = btn.getAttribute("data-angle");
        if (anglePresets[angle]) {
          rotX = anglePresets[angle].x;
          rotY = anglePresets[angle].y;
          updateTransform(true);
        }
      });
    });

    resetAngleBtn.addEventListener("click", resetToFront);

    stageWrapper.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".stage-footer, button")) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      paperScene.classList.remove("smooth-preset");
      stageWrapper.setPointerCapture(e.pointerId);
    });

    stageWrapper.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      rotY += dx * 0.55;
      rotX -= dy * 0.55;
      rotX = Math.max(-65, Math.min(75, rotX));
      startX = e.clientX;
      startY = e.clientY;
      updateTransform(false);
    });

    const endDrag = () => { isDragging = false; };
    stageWrapper.addEventListener("pointerup", endDrag);
    stageWrapper.addEventListener("pointercancel", endDrag);

    /* ── Animación del Doblez ── */
    function playFoldAnimation() {
      if (animTimer !== null) cancelAnimationFrame(animTimer);
      let start = null;
      const duration = 1600;
      animateFoldBtn.disabled = true;
      animateFoldBtn.innerHTML = "<span>⟳</span> Doblando…";

      function step(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / duration, 1);
        const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        drawPaperModel(actual, ease);

        if (progress < 1) {
          animTimer = requestAnimationFrame(step);
        } else {
          drawPaperModel(actual, 1);
          animTimer = null;
          animateFoldBtn.disabled = false;
          animateFoldBtn.innerHTML = "<span>▶</span> Ver cómo se dobla";
        }
      }
      animTimer = requestAnimationFrame(step);
    }

    animateFoldBtn.addEventListener("click", playFoldAnimation);

    /* ── Accesibilidad: Tamaño de Texto ── */
    fontToggleBtn.addEventListener("click", () => {
      largeFont = !largeFont;
      document.documentElement.style.setProperty("--font-size-base", largeFont ? "19px" : "16px");
      fontBtnText.textContent = largeFont ? "Letra normal" : "Letra grande";
    });

    /* ── Confetti Celebratorio en Canvas ── */
    function dispararConfetti() {
      const ctx = confettiCanvas.getContext("2d");
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      const particles = [];
      const colors = ["#e8734a", "#336948", "#f4a261", "#d9383a", "#ffffff", "#ffd166"];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: confettiCanvas.width * 0.5 + (Math.random() * 140 - 70),
          y: confettiCanvas.height * 0.35 + (Math.random() * 60 - 30),
          vx: (Math.random() - 0.5) * 11,
          vy: Math.random() * -7 - 3,
          size: Math.random() * 9 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10
        });
      }

      let frames = 0;
      function loop() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        frames++;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.28;
          p.rotation += p.rotationSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx.restore();
        });

        if (frames < 120) {
          requestAnimationFrame(loop);
        } else {
          ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
      }
      loop();
    }

    /* ── Navegación con Teclado ── */
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        if (actual < pasos.length - 1) { actual++; render(); }
      } else if (e.key === "ArrowLeft") {
        if (actual > 0) { actual--; render(); }
      }
    });

    function render() {
      const p = pasos[actual];
      const numero = actual + 1;
      stepChip.textContent = `Paso ${numero} de ${pasos.length}`;
      progressFill.style.width = `${(numero / pasos.length) * 100}%`;
      stepTitle.textContent = p.titulo;
      stepInstruction.textContent = p.instruccion;
      stepTip.innerHTML = `<strong>💡 El truco:</strong> ${p.consejo}`;
      btnPrev.disabled = actual === 0;

      if (actual === pasos.length - 1) {
        btnNext.textContent = "¡Completado! 🎉";
        celebrationBanner.classList.add("show");
        dispararConfetti();
      } else {
        btnNext.textContent = "Siguiente paso →";
        celebrationBanner.classList.remove("show");
      }

      // Cada cambio de paso resetea la vista de frente para no desorientar
      resetToFront();
      drawPaperModel(actual, 0);
    }

    btnPrev.addEventListener("click", () => {
      if (actual > 0) { actual--; render(); }
    });

    btnNext.addEventListener("click", () => {
      if (actual < pasos.length - 1) { actual++; render(); }
      else { actual = 0; render(); }
    });

    render();
  </script>
</body>
